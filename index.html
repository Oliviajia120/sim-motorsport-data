<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim Motorsport Data</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#101214;color:#e7ebef;font-family:Segoe UI,system-ui,sans-serif;height:100%}
button,input{font:inherit}
button{background:#22262c;color:#e7ebef;border:0;border-radius:4px;padding:0.45rem 0.7rem;cursor:pointer}
button.on,header button{background:#e85d04;color:#1a0d04;font-weight:650}
h1{font-size:1.1rem;margin:0}
h2{font-size:0.72rem;letter-spacing:.06em;text-transform:uppercase;color:#8e98a3;margin:0 0 .4rem}
.bar{display:flex;gap:.7rem;align-items:center;padding:.7rem 1rem;background:#181b1f;border-bottom:1px solid #323840;flex-wrap:wrap}
.meta{color:#8e98a3;font-family:ui-monospace,monospace;font-size:.85rem}
.empty{max-width:36rem;margin:4rem auto;padding:0 1.2rem}
.empty h2{font-size:1.7rem;color:#e7ebef;letter-spacing:0;text-transform:none}
.layout{display:flex;min-height:calc(100vh - 58px)}
aside{width:280px;background:#181b1f;border-right:1px solid #323840;padding:.8rem;overflow:auto}
main{flex:1;padding:.8rem;overflow:auto;min-width:0}
.list label,.laprow label{display:flex;gap:.45rem;align-items:center;font-size:.9rem;padding:.2rem 0}
.laprow{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
.laprow i{width:.65rem;height:.65rem;border-radius:99px;display:inline-block}
.row{display:flex;justify-content:space-between;align-items:center}
.link{background:transparent;color:#e85d04;padding:0}
.card{background:#181b1f;border:1px solid #323840;border-radius:6px;padding:.8rem;margin-bottom:.7rem}
.idealrow{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.kicker{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#8e98a3}
.ideal{font-family:ui-monospace,monospace;font-size:2rem;color:#3ddc97}
.sub,.hint{color:#8e98a3;font-size:.85rem}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.tools input{width:3rem;background:transparent;color:#e7ebef;border:0}
.splitbar{position:relative;height:3rem;background:#101214;border-radius:4px;cursor:crosshair}
.track{position:absolute;left:0;right:0;top:50%;height:4px;background:#323840;transform:translateY(-50%)}
.mark{position:absolute;top:4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.mark b{width:2px;height:1.2rem;background:#e85d04;display:block}
.mark span{color:#e85d04;font-size:.75rem;font-family:ui-monospace,monospace}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.plot{border:1px solid #323840;border-radius:4px;margin-bottom:.45rem;overflow:hidden;background:#181b1f}
table{width:100%;border-collapse:collapse;font-size:.85rem;background:#181b1f}
th,td{padding:.4rem .6rem;border-bottom:1px solid #323840;text-align:right;font-family:ui-monospace,monospace}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left;font-family:Segoe UI,system-ui,sans-serif}
th{color:#8e98a3;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
.best{color:#3ddc97}
.foot td{background:#22262c}
@media(max-width:800px){.layout{flex-direction:column}aside{width:auto;max-height:40vh}}
</style>
</head>

      const foot = `<tr class="foot"><td colspan="2">Ideal</td>${laps.map((l) => `<td>${formatLap(l.duration)}</td>`).join("")}<td class="best">${formatLap(ideal)}</td></tr>`;
      document.getElementById("table").innerHTML = `<table>${head}${body}${foot}</table>`;
    }
  }
  function draw(canvas, wrap, title, unit, series, xMax, splitTimes, cursor) {
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    const width = wrap.clientWidth || 800;
    const height = 160;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = "100%";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pad = { l: 52, r: 12, t: 22, b: 22 };
    const plotW = Math.max(1, width - pad.l - pad.r);
    const plotH = Math.max(1, height - pad.t - pad.b);
    ctx.fillStyle = "#181b1f";
    ctx.fillRect(0, 0, width, height);
    let yMin = Infinity;
    let yMax = -Infinity;
    for (const line of series) {
      for (const p of line.samples) {
        const y = p.v * line.scale;
        if (!Number.isFinite(y)) continue;
        if (y < yMin) yMin = y;
        if (y > yMax) yMax = y;
      }
    }
    if (!Number.isFinite(yMin)) {
      yMin = 0;
      yMax = 1;
    }
    if (yMax - yMin < 1e-6) {
      yMin -= 1;
      yMax += 1;
    }
    const padY = (yMax - yMin) * 0.08;
    yMin -= padY;
    yMax += padY;
    const xOf = (t) => pad.l + t / Math.max(xMax, 1e-3) * plotW;
    const yOf = (v) => pad.t + (1 - (v - yMin) / (yMax - yMin)) * plotH;
    ctx.strokeStyle = "#2a3036";
    ctx.font = "11px ui-monospace, monospace";
    ctx.fillStyle = "#8e98a3";
    for (let i = 0; i <= 4; i++) {
      const y = pad.t + plotH * i / 4;
      ctx.beginPath();
      ctx.moveTo(pad.l, y);
      ctx.lineTo(width - pad.r, y);
      ctx.stroke();
      ctx.fillText(String(Math.round(yMax - (yMax - yMin) * i / 4)), 4, y + 3);
    }
    ctx.save();
    ctx.beginPath();
    ctx.rect(pad.l, pad.t, plotW, plotH);
    ctx.clip();
    for (const line of series) {
      ctx.beginPath();
      ctx.strokeStyle = line.color;
      ctx.lineWidth = 1.6;
      let started = false;
      for (const p of line.samples) {
        const y = p.v * line.scale;
        if (!Number.isFinite(y)) continue;
        const x = xOf(p.t);
        const yy = yOf(y);
        if (!started) {
          ctx.moveTo(x, yy);
          started = true;
        } else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = "#f0c14d";
    for (const t of splitTimes) {
      const x = xOf(t);
      ctx.beginPath();
      ctx.moveTo(x, pad.t);
      ctx.lineTo(x, pad.t + plotH);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    if (cursor != null) {
      const x = xOf(cursor);
      ctx.strokeStyle = "#e7ebef";
      ctx.beginPath();
      ctx.moveTo(x, pad.t);
      ctx.lineTo(x, pad.t + plotH);
      ctx.stroke();
    }
    ctx.fillStyle = "#e7ebef";
    ctx.font = "600 12px sans-serif";
    ctx.fillText(unit ? `${title}  \xB7  ${unit}` : title, pad.l, 14);
  }
  var picker = document.createElement("input");
  picker.type = "file";
  picker.accept = ".xrk,.xrz";
  picker.style.display = "none";
  document.body.appendChild(picker);
  picker.onchange = async () => {
    const file = picker.files?.[0];
    picker.value = "";
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const parsed = parseXrk(new Uint8Array(buf));
      const prepared = prepare(parsed, file.name);
      if (!prepared.laps.length) {
        alert("No laps with a usable distance trace were found.");
        return;
      }
      state.log = prepared;
      const match = [/gps speed/i, /rpm/i, /front fork/i, /rear shock/i, /twist/i, /gear/i];
      const defaults = prepared.channels.filter((c) => match.some((r) => r.test(c.label) || r.test(c.key))).slice(0, 5);
      state.keys = (defaults.length ? defaults : prepared.channels.slice(0, 3)).map((c) => c.key);
      const quick = fastest(prepared.laps).duration;
      const flying = prepared.laps.filter((l) => l.duration < quick * 1.12);
      state.laps = (flying.length ? flying : prepared.laps).map((l) => l.num);
      state.anchor = fastest(flying.length ? flying : prepared.laps).num;
      const saved = localStorage.getItem("lap-splits:" + prepared.track);
      state.splits = [];
      if (saved) {
        try {
          const arr = JSON.parse(saved);
          if (Array.isArray(arr)) state.splits = arr.filter((n) => typeof n === "number" && n > 0.01 && n < 0.99);
        } catch {
        }
      }
      render();
    } catch (err) {
      alert(err instanceof Error ? err.message : "Could not read that file.");
    }
  };
  function pick() {
    picker.click();
  }
  render();
})();
</script>
</body>
</html>
