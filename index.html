<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim Motorsport Data</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#101214;color:#e7ebef;font-family:Segoe UI,system-ui,sans-serif;height:100%;overflow:hidden}
button,input,select{font:inherit}
button{background:#22262c;color:#e7ebef;border:0;border-radius:4px;padding:0.45rem 0.7rem;cursor:pointer}
button.on,header button,button.go{background:#e85d04;color:#1a0d04;font-weight:650}
h1{font-size:1.1rem;margin:0}
h2{font-size:0.72rem;letter-spacing:.06em;text-transform:uppercase;color:#8e98a3;margin:0 0 .4rem}
#app{height:100%;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;gap:.7rem;align-items:center;padding:.7rem 1rem;background:#181b1f;border-bottom:1px solid #323840;flex-wrap:wrap;flex:0 0 auto}
.meta{color:#8e98a3;font-family:ui-monospace,monospace;font-size:.85rem}
.empty{max-width:40rem;margin:4rem auto;padding:0 1.2rem}
.empty h2{font-size:1.7rem;color:#e7ebef;letter-spacing:0;text-transform:none}
.layout{display:flex;flex:1;min-height:0;overflow:hidden}
aside{width:280px;background:#181b1f;border-right:1px solid #323840;padding:.8rem;display:grid;grid-template-rows:auto auto minmax(4.5rem,14rem) auto minmax(6.5rem,1fr);align-content:start;min-height:0;overflow:hidden}
aside input{width:100%;margin:0 0 .45rem;background:#101214;color:#e7ebef;border:1px solid #323840;border-radius:4px;padding:.35rem .45rem}
main{flex:1;padding:.8rem .8rem 6.5rem;overflow:auto;min-width:0;min-height:0}
.list{min-height:0;max-height:14rem;margin:0 0 .7rem;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;border:1px solid #323840;border-radius:4px;background:#101214}
.list label{display:grid;grid-template-columns:1rem minmax(0,1fr);align-items:center;column-gap:.5rem;min-height:1.6rem;font-size:.84rem;padding:0 .35rem}
.list label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list input{margin:0;width:1rem;height:1rem;justify-self:center}
#laps{min-height:0;overflow-y:auto;overscroll-behavior:contain}
.laprow label{display:flex;gap:.45rem;align-items:center;font-size:.9rem;padding:.2rem 0}
.laprow{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
.laprow i{width:.65rem;height:.65rem;border-radius:99px;display:inline-block}
.row{display:flex;justify-content:space-between;align-items:center}
.link{background:transparent;color:#e85d04;padding:0}
.card{background:#181b1f;border:1px solid #323840;border-radius:6px;padding:.8rem;margin-bottom:.7rem}
.idealrow{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.kicker{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#8e98a3}
.ideal{font-family:ui-monospace,monospace;font-size:2rem;color:#3ddc97}
.sub,.hint{color:#8e98a3;font-size:.85rem}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.tools input{width:3rem;background:transparent;color:#e7ebef;border:0}
.tools input.tplname{width:8.5rem;background:#101214;border:1px solid #323840;border-radius:4px;padding:.35rem .45rem}
.tools select{background:#101214;color:#e7ebef;border:1px solid #323840;border-radius:4px;padding:.35rem .45rem;max-width:12rem}
.tmpl{display:flex;align-items:center;gap:.35rem;color:#8e98a3;font-size:.85rem}
.splitbar{position:relative;height:3rem;background:#101214;border-radius:4px;cursor:crosshair;overflow:hidden}
.track{position:absolute;left:0;right:0;top:50%;height:4px;background:#323840;transform:translateY(-50%)}
.zone{position:absolute;top:6px;bottom:6px;background:rgba(232,93,4,.16);border-radius:3px;pointer-events:none}
.zone span{position:absolute;left:2px;bottom:1px;color:#f0c14d;font-size:.62rem;font-family:ui-monospace,monospace}
.mark{position:absolute;top:4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.mark b{width:2px;height:1.2rem;background:#e85d04;display:block}
.mark span{color:#e85d04;font-size:.75rem;font-family:ui-monospace,monospace}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.chip{font-family:ui-monospace,monospace;font-size:.75rem;color:#f0c14d;background:#22262c;border-radius:4px;padding:.28rem .45rem}
.readout{position:fixed;left:12px;right:12px;bottom:10px;z-index:30;display:flex;align-items:stretch;gap:.15rem;background:#181b1f;color:#e7ebef;border:1px solid #e85d04;border-radius:4px;padding:.4rem .5rem;font-family:ui-monospace,monospace;font-size:.85rem;overflow-x:auto}
.readout-time{display:flex;align-items:flex-end;min-width:4.6rem;padding:0 .45rem .05rem 0;color:#f0c14d;font-weight:650}
.readout-item{display:flex;flex-direction:column;justify-content:center;min-width:7.5rem;max-width:11rem;padding:0 .55rem;border-left:1px solid #323840}
.readout-item span{color:#8e98a3;font-size:.68rem;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readout-item b{font-weight:650;font-size:.95rem}
.plot{border:1px solid #323840;border-radius:4px;margin-bottom:.45rem;overflow:hidden;background:#181b1f;cursor:crosshair;touch-action:none}
.plot canvas{display:block;width:100%}
.delta-plot{background:#181b1f;border:1px solid #323840;border-radius:4px;overflow:hidden;min-height:2rem}
.delta-plot canvas{display:block;width:100%;cursor:crosshair}
.review{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,340px);gap:.75rem;align-items:start}
.track-map{height:280px;background:#181b1f;border:1px solid #323840;border-radius:4px;overflow:hidden}
.track-map canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
table{width:100%;border-collapse:collapse;font-size:.85rem;background:#181b1f}
th,td{padding:.4rem .6rem;border-bottom:1px solid #323840;text-align:right;font-family:ui-monospace,monospace}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left;font-family:Segoe UI,system-ui,sans-serif}
th{color:#8e98a3;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
.best{color:#3ddc97}
.gain{color:#3ddc97}
.loss{color:#fb7185}
td .d{display:block;font-size:.72rem;font-weight:650}
.link td{color:#8e98a3}
.foot td{background:#22262c}
.grok-panel{position:fixed;top:64px;right:12px;bottom:78px;width:min(380px,calc(100vw - 24px));background:#181b1f;border:1px solid #e85d04;border-radius:6px;z-index:40;display:flex;flex-direction:column;gap:.4rem;padding:.7rem}
.grok-panel input,.grok-panel textarea{width:100%;background:#101214;color:#e7ebef;border:1px solid #323840;border-radius:4px;padding:.4rem}
.grok-panel textarea{min-height:4.2rem;resize:vertical}
.grok-log{flex:1;overflow:auto;min-height:0}
.grok-log p{margin:.35rem 0;white-space:pre-wrap}
.grok-log .me{color:#f0c14d}
.grok-panel a{color:#e85d04}
@media(max-width:800px){.layout{flex-direction:column}aside{width:auto;max-height:48vh;grid-template-rows:auto auto minmax(3.2rem,16vh) auto minmax(6.5rem,1fr)}.list{max-height:16vh}.review{grid-template-columns:1fr}}
</style>
</head>

        zeroLine: true,
        fillToZero: true,
        bands: state.spans.filter((span) => span.kind === "corner").map((span) => ({ from: span.from * ref.total, to: span.to * ref.total, label: span.label })),
        series: laps.slice(1).map((lap) => ({
          name: lapName(lap),
          color: colorOf(lap),
          dash: lap.side === "B",
          points: deltaVsDistance(ref, lap, 300).map((point) => ({ x: point.metres, y: point.delta }))
        }))
      });
    }
    for (const key of [coach.brake, coach.throttle, coach.lean]) {
      const chart = channelChart(laps, key);
      if (chart) charts.push(chart);
    }
    if (charts.length < 3) {
      const speed = channelChart(laps, coach.speed);
      if (speed) charts.push(speed);
    }
    const note = {
      track: log.track,
      rider: log.rider,
      vehicle: log.vehicle,
      fileName: state.compare ? `${log.fileName} vs ${state.compare.fileName}` : log.fileName,
      when: log.when,
      template: templateLabel(),
      ideal,
      laps: laps.map((lap, index) => {
        const gap = lap.duration - ref.duration;
        return {
          name: lapName(lap),
          time: formatLap(lap.duration),
          color: colorOf(lap),
          role: index === 0 ? "Reference" : `${formatSigned(gap)} s ${word(gap)} on the full lap`
        };
      }),
      sectorHeaders: laps.map((lap, index) => index === 0 ? `${lapName(lap)} ref` : lapName(lap)),
      sectors: tableRows.map((row) => ({
        label: sectorLabel(row),
        distance: distanceText(row),
        cells: row.times.map((time, index) => {
          if (index === 0) return { text: formatLap(time), delta: "", tone: "ref" };
          const gap = time - row.times[0];
          return { text: formatLap(time), delta: `${formatSigned(gap)} ${word(gap)}`, tone: tone(gap) };
        })
      })),
      lossesTitle: compare ? `Top time lost by ${lapName(compare)} vs ${lapName(ref)}` : "Top time lost",
      losses: losses.map((item) => ({
        label: sectorLabel(item.row),
        text: `${formatSigned(item.delta)} s behind`
      })),
      emptyLosses: compare ? `${lapName(compare)} is ahead in every sector versus ${lapName(ref)}.` : "Select a second lap to list sector losses.",
      convention: `Positive time is behind the reference (lost time). Negative time is ahead of the reference (gained time). Corner bands sit on the delta chart.${missing.length ? ` This session has no ${listWords(missing)} channel.` : ""}`,
      charts
    };
    try {
      await downloadCoachingNote(note, kind, safeStem(`${log.track}-${log.fileName}-coaching-note`));
    } catch (err) {
      alert(err instanceof Error ? err.message : "Could not export the coaching note.");
    }
  }
  var BCOLORS = ["#7dd3fc", "#c4b5fd", "#fb7185", "#fde68a", "#86efac", "#e2e8f0", "#67e8f9", "#f9a8d4"];
  function colorOf(lap) {
    const list = lap.side === "B" ? state.compare?.laps : state.log?.laps;
    const index = Math.max(0, list?.findIndex((item) => item.id === lap.id) ?? 0);
    return lap.side === "B" ? BCOLORS[index % BCOLORS.length] : lapColor(index);
  }
  var picker = document.createElement("input");
  picker.type = "file";
  picker.accept = ".xrk,.xrz,.vbo";
  picker.style.display = "none";
  document.body.appendChild(picker);
  var pickTarget = "A";
  picker.onchange = async () => {
    const file = picker.files?.[0];
    const target = pickTarget;
    pickTarget = "A";
    picker.value = "";
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const parsed = file.name.toLowerCase().endsWith(".vbo") ? parseVbo(new TextDecoder().decode(buf), file.name) : parseXrk(new Uint8Array(buf));
      const prepared = prepare(parsed, file.name, target);
      if (!prepared.laps.length) {
        alert("No laps with a usable distance trace were found.");
        return;
      }
      const quick = fastest(prepared.laps).duration;
      const flying = prepared.laps.filter((l) => l.duration < quick * 1.12);
      const ids = (flying.length ? flying : prepared.laps).map((l) => l.id);
      if (target === "B") {
        state.compare = prepared;
        state.laps = [...state.laps.filter((id) => id.startsWith("A")), ...ids];
        render();
        return;
      }
      state.log = prepared;
      state.compare = null;
      const coachKeys = coachingChannelKeys(prepared.channels);
      const defaults = [coachKeys.brake, coachKeys.throttle, coachKeys.lean].filter((key) => !!key);
      state.keys = defaults.length ? defaults : prepared.channels.slice(0, 3).map((channel) => channel.key);
      state.laps = ids;
      state.anchor = fastest(flying.length ? flying : prepared.laps).id;
      const saved = parseSplitDocument(localStorage.getItem("lap-splits:" + prepared.track));
      state.spans = [];
      state.templateId = "manual";
      state.lapLengthM = rulerLength();
      if (saved) {
        state.spans = saved.spans;
        state.templateId = saved.templateId;
        state.lapLengthM = saved.lapLengthM || state.lapLengthM;
      } else if (/zhuhai|\bzic\b/i.test(`${prepared.track} ${prepared.fileName}`)) {
        applyTemplateId("zic");
      }
      render();
    } catch (err) {
      alert(err instanceof Error ? err.message : "Could not read that file.");
    }
  };
  function pick() {
    picker.click();
  }
  render();
})();

</script>
</body>
</html>
